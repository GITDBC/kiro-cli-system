version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/tools/*"
      - "/.kiro/skills/deps-audit/references/depschecker"
      - "/.kiro/skills/jira/references/jirafetcher"
      - "/.kiro/skills/doc2md/references/doc2md"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "uv"
    groups:
      uv:
        patterns:
          - "*"
