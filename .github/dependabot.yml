version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/tools/*"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "uv"
    # With `directories`, one group spans every tools/* directory, so a pin
    # shared by several tools moves in one pull request, not one per tool.
    groups:
      uv:
        patterns:
          - "*"
