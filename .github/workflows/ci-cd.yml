name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-env

      - name: Validate files and configuration
        uses: ./.github/actions/files-configs-validation

  list-tools:
    name: List tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive tool list from Makefile
        id: list
        run: |
          tools=$(make -s print-tools | jq -R -c 'split(" ") | map(select(length > 0))')
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  test-tools:
    name: Test ${{ matrix.tool }}
    needs: list-tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.list-tools.outputs.tools) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-env
        with:
          cache-dependency-glob: |
            tools/${{ matrix.tool }}/pyproject.toml
            tools/${{ matrix.tool }}/uv.lock
          cache-suffix: ${{ matrix.tool }}

      - name: Lint
        run: make lint-${{ matrix.tool }}

      - name: Test
        run: make test-${{ matrix.tool }}

  release:
    name: Release
    needs: [repo-checks, test-tools]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and check tag
        id: version
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::notice::Tag $tag already exists, skipping release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        id: zip
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip_name="work-agents-${TAG}.zip"
          zip -r "$zip_name" . -x ".git/*" -x ".github/*"
          echo "name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
