name: Setup Python Environment and uv
description: Setup Python, uv, and dependencies for the project

inputs:
  src-python-version:
    description: "Python version to set up for the project"
    required: false
    default: "3.13"
  cache-dependency-glob:
    description:
      "Glob of files whose hash keys the uv cache; the default mirrors setup-uv's own
      default, so callers that pass nothing keep the repository-wide key"
    required: false
    default: |
      **/*requirements*.txt
      **/*requirements*.in
      **/*constraints*.txt
      **/*constraints*.in
      **/pyproject.toml
      **/uv.lock
      **/*.py.lock
  cache-suffix:
    description: "Suffix appended to the uv cache key, e.g. the tool name"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.30"
        python-version: ${{ inputs.src-python-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        cache-suffix: ${{ inputs.cache-suffix }}
