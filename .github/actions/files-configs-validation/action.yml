name: Files and Configuration Validation
description: >
  Validate repository files and configuration (VERSION, agent JSON, skills, drift,
  formatting, hooks). Requires Node.js dependencies installed and uv available.

runs:
  using: composite
  steps:
    - name: Validate VERSION file
      shell: bash
      run: |
        test -f VERSION || { echo "::error::VERSION file missing"; exit 1; }
        grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION || { echo "::error::VERSION must be semver (X.Y.Z)"; exit 1; }

    - name: Validate agent JSON configs
      shell: bash
      run: |
        for f in .kiro/agents/*.json; do
          uv run python -m json.tool "$f" > /dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
        done
        echo "All $(ls .kiro/agents/*.json | wc -l) agent configs valid."

    - name: Validate skill structure
      shell: bash
      run: |
        for d in .kiro/skills/*/; do
          test -f "${d}SKILL.md" || { echo "::error::Missing SKILL.md in $d"; exit 1; }
        done
        echo "All $(ls -d .kiro/skills/*/ | wc -l) skills have SKILL.md."

    - name: Drift check
      shell: bash
      run: make drift-check

    - name: Format check
      shell: bash
      run: make fmt-check

    - name: Hook regression tests
      shell: bash
      run: make hook-test
