name: Files Checker
description: Repo-wide structural gates that are not per-tool lint/test (that belongs to test-tools).

runs:
  using: composite
  steps:
    - name: Drift check
      shell: bash
      run: make drift-check

    - name: Format check
      shell: bash
      run: make fmt-check

    - name: Hook regression tests
      shell: bash
      run: make hook-test
